name: Wunsch / Idee
description: Vorschlag für eine neue Funktion oder Verbesserung (feature request)
title: "[Wunsch] "
labels: ["wunsch"]
body:
  - type: textarea
    id: wunsch
    attributes:
      label: Was wünschst du dir? / What would you like?
    validations:
      required: true
  - type: textarea
    id: wozu
    attributes:
      label: Wozu? / Why?
      description: In welcher Situation würde es helfen?
  - type: input
    id: sender
    attributes:
      label: Sender / Radio
  - type: input
    id: ethos
    attributes:
      label: Ethos-Version / Ethos version
      description: z. B. 26.2.0 (System › Info)
  - type: input
    id: empfaenger
    attributes:
      label: Empfänger / Receiver
      description: z. B. Archer SR10+, TD R10 (2,4 GHz + 900 MHz), TW R6
